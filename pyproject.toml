[project]
name = "fabrica"
version = "0.1.0"
description = "Fábrica de petições sintéticas: peças fictícias do direito brasileiro"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.12.0",
    "pydantic==2.14.4",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
